# 3-way condition classification: clean / soiled / damaged.
# Same 6-class source as multiclass, projected to the condition taxonomy
# (see src/solarsoil/taxonomy.py). This is the headline "soiling vs fault" framing.
#   python -m solarsoil.data.download --source faulty
#   python -m solarsoil.data.manifest --data-root Data/raw/faulty \
#       --out manifests/condition_manifest.csv --label-space condition
task: condition
data_root: Data/raw/faulty
manifest: manifests/condition_manifest.csv

img_size: 224
batch_size: 32
num_workers: 4
augment: true

backbone: resnet50
pretrained: true

epochs: 30
unfreeze_after: 5
lr_head: 1.0e-4
lr_finetune: 5.0e-5
weight_decay: 1.0e-4
step_size: 10
gamma: 0.1
use_class_weights: true
patience: 7

seed: 123
device: auto
out_dir: artifacts/condition
