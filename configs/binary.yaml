# Binary clean-vs-dirty baseline — the modular port of the original notebook.
task: binary                       # label space: binary | condition | multiclass
data_root: Data                    # image root (subfolders Clean/ Dusty/)
manifest: manifests/binary_manifest.csv

# Input / loading
img_size: 224
batch_size: 32
num_workers: 4
augment: true

# Model
backbone: resnet50                 # resnet50 | resnet18 | mobilenet_v3_large | efficientnet_b0
pretrained: true

# Two-stage transfer learning
epochs: 20
unfreeze_after: 5                  # epochs of frozen-backbone feature extraction
lr_head: 1.0e-4
lr_finetune: 5.0e-5
weight_decay: 0.0
step_size: 7                       # StepLR
gamma: 0.1
use_class_weights: true            # weighted CE for the ~1.4:1 clean:dirty imbalance
patience: 5                        # early stopping on val loss

# Reproducibility / output
seed: 123
device: auto                       # auto -> cuda > mps > cpu
out_dir: artifacts/binary
