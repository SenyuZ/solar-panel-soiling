[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarsoil"
version = "0.1.0"
description = "Solar panel soiling & fault classification, severity estimation, and explainability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Senyu Zhu" }]
keywords = ["computer-vision", "image-processing", "solar-panels", "soiling", "deep-learning"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pillow>=10.0",
    "imagehash>=4.3",
    "opencv-python>=4.8",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "torchvision>=0.17",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
download = ["kagglehub>=0.3", "gdown>=5.1"]
demo = ["gradio>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
solarsoil-manifest = "solarsoil.data.manifest:main"
solarsoil-train = "solarsoil.train:main"
solarsoil-evaluate = "solarsoil.evaluate:main"
solarsoil-predict = "solarsoil.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
